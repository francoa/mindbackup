[project]
name = "voice-mind-backup"
version = "0.1.0"
description = "Voice memo -> transcript -> Obsidian vault. Milestone 1: ugly end-to-end."
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
cloud = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
mindbackup = "mindbackup.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Supply-chain cooling-off: ignore artifacts uploaded in the last 7 days, so a
# compromised release has time to be caught and yanked before we install it.
# Relative duration = rolling window that never goes stale (uv >= 0.9).
exclude-newer = "7 days"
